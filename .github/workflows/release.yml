name: Release (Tag gen*)

on:
  push:
    tags: ["gen*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PlatformIO installieren
        run: pip install --upgrade platformio
      - name: Firmware bauen (Core2)
        run: pio run -e m5stack-core2
      - name: Datei benennen
        run: |
          mkdir -p out
          cp .pio/build/m5stack-core2/merged-flash.bin "out/OSSM-M5-Remote_core2_2-2-0-${GITHUB_REF_NAME}_FLASH-AT-0x0.bin"
          md5sum out/*.bin > out/md5.txt
          cat out/md5.txt
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.bin out/md5.txt \
            --title "M5 Generator $GITHUB_REF_NAME (ESP-NOW, für OSSM-Stroke)" \
            --notes "Rückweg-Stand der M5-Firmware für OSSM-Stroke (ESP-NOW). Flashen: merged-flash.bin mit esptool-js an Adresse 0x0. Nachfolger für Stock-Firmware: RedDelfin/M5-BLE-Gen-stock."
